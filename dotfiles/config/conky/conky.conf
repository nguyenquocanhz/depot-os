-- Depot OS — Widget Board (Conky): cụm widget góc phải kiểu macOS
-- clock + hệ thống + bảng cảm biến kiểu HWMonitor (depot-hwmon.lua), thẻ nền mờ, không viền

-- depot-hwmon.lua nằm cạnh file này (~/.config/conky/)
local here = (debug.getinfo(1, 'S').source or ''):match('^@(.*/)')
if not here or not io.open(here .. 'depot-hwmon.lua') then
    here = (os.getenv('HOME') or '') .. '/.config/conky/'
end

conky.config = {
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 120,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'top_right',
    gap_x = 28,
    gap_y = 48,
    minimum_width = 316,
    maximum_width = 316,
    double_buffer = true,
    update_interval = 2,
    use_xft = true,
    font = 'Inter:pixelsize=11',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    default_color = 'e8eefb',
    color1 = '8fa7cf',
    color2 = '6f9ad8',
    no_buffers = true,
    cpu_avg_samples = 2,
    lua_load = here .. 'depot-hwmon.lua',
}

conky.text = [[
${font Inter:bold:pixelsize=34}${color e8eefb}${time %H:%M}${font}
${voffset 2}${font Inter:pixelsize=12}${color 8fa7cf}${time %A, %d/%m/%Y}${font}
${voffset 10}${color 3d6db5}${hr 2}

${font Inter:bold:pixelsize=11}${color 8fa7cf}HỆ THỐNG${font} ${color 8fa7cf}— depot://widget-board
${color e8eefb} CPU ${goto 120}${color 6f9ad8}${cpubar cpu0 8,150}${color} ${cpu cpu0}%
${color e8eefb} RAM ${goto 120}${color 6f9ad8}${membar 8,150}${color} ${memperc}%
${color e8eefb} Swap ${goto 120}${color 6f9ad8}${swapbar 8,150}${color} ${swapperc}%
${color e8eefb} Disk ${goto 120}${color 6f9ad8}${fs_bar 8,150 /}${color} ${fs_used_perc /}%

${color e8eefb} Uptime ${goto 120}${color 8fa7cf}${uptime_short}
${color e8eefb} Đĩa trống ${goto 120}${color 8fa7cf}${fs_free /}

${lua_parse depot_hw}

${color 3d6db5}${hr 2}
${voffset -4}${font Inter:pixelsize=10}${color 8fa7cf}depot://smooth · beautiful · yours
${voffset -6}
]]
