# Depot OS — cấu hình picom (gốc cho depot-effects)
# depot-effects đọc file này, bỏ các khối mà người dùng tắt trong "Hiệu ứng hình ảnh"
# rồi chạy bản đã lọc ở ~/.cache/depot/picom.conf. Giữ nguyên các dòng đánh dấu # [tên] ... # [/tên].
# Khối [anim] chỉ fork pijulius (picom-animated) hiểu; picom chính chủ chạy bản đã bỏ khối này.
backend = "glx";
vsync = true;
# Vẽ lại cả màn hình mỗi khi có thay đổi. Để true (chỉ vẽ vùng đổi) thì sau khi đóng menu Start,
# icon ghim trên taskbar (docklike) biến mất tới khi rê chuột qua. Máy đứng yên thì không vẽ gì.
use-damage = false;

# [shadow]
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.5;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
    "name = 'Notification'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "class_g = 'plank'",
    "class_g = 'Conky'",
    "class_g = 'Depot-notify'",
    "class_g = 'Depot-island'"
];
# [/shadow]

# [fade]
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;
# [/fade]

# Không tắt compositing khi fullscreen (tránh nhấp nháy với video)
unredir-if-possible = false;

# [anim]
animations = true;
animation-stiffness = 190;
animation-dampening = 32;
animation-clamping = true;
animation-for-open-window = "zoom";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-down";
# [/anim]
