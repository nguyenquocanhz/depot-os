# Depot OS — Unikey: VNI (gõ dấu bằng phím số 0–9), Unicode, kiểu bỏ dấu mới (hoà, thuý)
# Đổi kiểu gõ: bảng điều khiển Unikey (Ctrl+Shift+F5 — depot-unikey), hoặc lệnh depot-unikey telex|vni|viqr
InputMethod=VNI
OutputCharset=Unicode
SpellCheck=True
Macro=False
# kiểu mới: dấu đặt trên nguyên âm chính (hoà, thuý) như Unikey "Đặt dấu oà, uý"
ModernStyle=True
# bỏ dấu ở bất kỳ đâu trong từ (gõ "tiengs" vẫn ra "tiếng")
FreeMarking=True
# gõ từ tiếng Anh (vd "window" thành "ưindo") thì tự trả lại phím gốc khi nhấn cách
AutoNonVnRestore=True
# đầu từ gõ w ra ư
ProcessWAtBegin=True
# không gạch chân chữ đang gõ: sửa trực tiếp trên ô nhập như Unikey
DisplayUnderline=False
SurroundingText=True
# KHÔNG bật "sửa từ đã gõ" (thử nghiệm): chế độ đó xoá lùi chữ trong ứng dụng để gõ lại — đúng kiểu gây MẤT CHỮ
# trong Terminal mà UniKey trên Windows hay gặp. Để False: từ đang gõ nằm trong vùng soạn, tới dấu cách / @ / Enter
# mới đưa vào ứng dụng một lần (thử 11/11/2026: 15 kiểu gõ quanh ký tự @ trong xfce4-terminal, không mất chữ nào).
ModifySurroundingText=False
