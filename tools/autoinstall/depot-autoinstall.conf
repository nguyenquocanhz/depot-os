# ============================================================================
#  depot-autoinstall.conf — file cài Depot OS tự động (giống autounattend.xml của Windows)
#  By WrenEvil.tech & nguyenquocanhz (nqatech)
# ============================================================================
#  Cách dùng nhanh:
#    1. Sửa file này (Notepad được) hoặc tạo bằng app "Depot Unattend" trên Windows.
#    2. Chép vào GỐC một USB (cùng USB chứa ISO nếu dùng Ventoy, hoặc USB thứ hai).
#    3. Boot ISO Depot OS, chọn mục "Cài tự động Depot OS" ở menu boot
#       (hoặc đặt AUTO_START=yes để khỏi chọn). Máy tự cài, không hỏi gì.
#  Kiểm tra file trước khi cài (trong phiên live, mở Terminal):
#       sudo depot-autoinstall --check /đường/dẫn/depot-autoinstall.conf
#
#  Cú pháp: KHOÁ=giá trị, mỗi dòng một khoá. Dòng bắt đầu bằng # là chú thích.
#  Giá trị có dấu cách hoặc dấu # thì để trong ngoặc kép: FULLNAME="Nguyễn Văn A"
# ============================================================================

# ---------- Khởi động -------------------------------------------------------
# yes = thấy file này ở gốc USB là tự cài luôn, không cần chọn mục boot "Cài tự động".
# no  = chỉ cài khi chọn mục "Cài tự động Depot OS" ở menu boot (an toàn hơn).
AUTO_START=no

# Đếm ngược (giây) trước khi format — nhấn phím bất kỳ trong lúc đếm để HUỶ. 0 = không đợi.
CONFIRM_TIMEOUT=15

# ---------- Nơi cài -----------------------------------------------------------
# disk      = XOÁ SẠCH CẢ Ổ rồi tự chia lại (máy chỉ dùng Depot OS)
# partition = chỉ QUICK FORMAT MỘT phân vùng, giữ nguyên các phân vùng khác (Windows, ổ D:, EFI…),
#             thêm Depot OS vào menu boot → khởi động kép với Windows (giống chọn phân vùng trong Windows Setup)
TARGET=disk

# --- TARGET=disk ---
# auto     = tự chọn khi máy chỉ có ĐÚNG 1 ổ trong (bỏ qua USB). Có từ 2 ổ trở lên thì dừng, không đoán.
# largest  = ổ trong lớn nhất      smallest = ổ trong nhỏ nhất
# /dev/sda, /dev/nvme0n1, /dev/disk/by-id/... = ghi rõ ổ (xem: sudo depot-autoinstall --list-disks)
DISK=auto
# !!! CẢNH BÁO: TOÀN BỘ DỮ LIỆU TRÊN Ổ SẼ BỊ XOÁ SẠCH (kể cả Windows, ổ D:, ảnh, tài liệu).
# Phải đổi thành yes thì mới cài — giống WillWipeDisk=true của Windows.
WIPE_DISK=no

# --- TARGET=partition ---
# Phân vùng sẽ bị quick format: /dev/sda3, /dev/nvme0n1p5, LABEL=DEPOT, UUID=… (xem: sudo depot-autoinstall --list-partitions)
# ask = lúc cài hiện DANH SÁCH phân vùng để chọn bằng phím mũi tên (không tự động hoàn toàn).
# Phân vùng Windows, EFI, Recovery, USB và phân vùng < 15 GB không bao giờ được chọn.
PARTITION=ask
# Phải là yes thì mới format (xác nhận dữ liệu trên phân vùng đó mất hẳn)
FORMAT_PARTITION=no

# ---------- Boot và định dạng ------------------------------------------------
# auto = theo kiểu máy đang boot · uefi · bios (Legacy) · both = cài cả Legacy lẫn UEFI (ổ boot được trên mọi máy)
#   TARGET=disk: uefi → GPT + EFI 512 MB; bios → MBR; both → GPT + BIOS boot 2 MB + EFI 512 MB
#   TARGET=partition: dùng phân vùng EFI có sẵn (Windows), GRUB vào MBR nếu Legacy; menu GRUB liệt kê cả Windows
BOOT_MODE=auto

# Hệ thống tệp: ext4 (khuyên dùng) hoặc btrfs
FILESYSTEM=ext4

# Swap tính bằng MB (TARGET=disk: phân vùng swap; TARGET=partition: file /swapfile). 0 = không (Depot có zram).
SWAP_SIZE=0

# ---------- Xác nhận trước khi cài -------------------------------------------
# Trước khi format và bung hệ thống, màn hình hiện bảng phân vùng (cái nào FORMAT, cái nào giữ nguyên) và cảnh báo.
# countdown = đếm ngược CONFIRM_TIMEOUT giây rồi tự cài (nhấn phím bất kỳ để huỷ)
# ask       = hỏi Cài / Huỷ, mặc định Huỷ (an toàn nhất, nhưng phải có người bấm)
CONFIRM=countdown

# ---------- Ngôn ngữ, bàn phím, giờ -----------------------------------------
# Ngôn ngữ hệ thống: vi_VN.UTF-8 (tiếng Việt), en_US.UTF-8 (tiếng Anh)…
LOCALE=vi_VN.UTF-8

# Kiểu bàn phím: us (phổ biến nhất ở VN). Gõ tiếng Việt dùng Unikey (fcitx5) có sẵn, không cần đổi.
KEYBOARD_LAYOUT=us
KEYBOARD_VARIANT=
KEYBOARD_MODEL=pc105
# Ví dụ đổi Caps Lock thành Ctrl: KEYBOARD_OPTIONS=ctrl:nocaps
KEYBOARD_OPTIONS=

# Múi giờ (tên chuẩn IANA): Asia/Ho_Chi_Minh, Asia/Bangkok, Asia/Tokyo, Europe/London…
TIMEZONE=Asia/Ho_Chi_Minh

# Đồng hồ phần cứng: auto (thấy Windows thì giữ giờ địa phương như Windows), local, utc
RTC=auto

# ---------- Máy và người dùng -----------------------------------------------
# Tên máy: chữ không dấu, số, gạch ngang
HOSTNAME=depot-pc

# Tên hiển thị (có dấu được) và tên đăng nhập (viết thường, không dấu, không cách)
FULLNAME="Người dùng Depot"
USERNAME=depot-user

# Mật khẩu: NÊN dùng PASSWORD_HASH (đã mã hoá) — file này nằm trên USB, ai cầm USB cũng đọc được.
#   Tạo hash: app "Depot Unattend" tự làm, hoặc trên Linux: openssl passwd -6
#   Có PASSWORD_HASH thì PASSWORD bị bỏ qua.
PASSWORD=doimatkhau
PASSWORD_HASH=

# yes = tự đăng nhập vào desktop không cần gõ mật khẩu (mật khẩu vẫn cần cho sudo / cài phần mềm)
AUTOLOGIN=no

# ---------- Mạng (chỉ cần khi cắm Wi-Fi, dây LAN thì tự có) -----------------
# Wi-Fi để tải ứng dụng lúc cài. Máy đã cài nhớ luôn mạng này.
WIFI_SSID=
WIFI_PASSWORD=

# ---------- Phần mềm ---------------------------------------------------------
# Firefox, VLC, LocalSend có sẵn trong ISO — cài được cả khi không có mạng.
# yes = tải thêm bộ app của Depot OS lúc cài (GNOME Software, VLC, Telegram, Discord, Claude, in ấn…), cần mạng.
#       Không có mạng thì máy tự cài sau khi có mạng.
INSTALL_APPS=yes

# Gói Debian cài thêm (cần mạng), cách nhau bằng dấu cách. Ví dụ: EXTRA_PACKAGES="htop git build-essential"
EXTRA_PACKAGES=

# ---------- Truy cập từ xa: OpenSSH + tường lửa ufw -------------------------------
# yes = bật OpenSSH server (máy mới có khoá máy chủ riêng; root không đăng nhập được qua SSH)
SSH=no
SSH_PORT=22
# User riêng cho SSH (khác USERNAME, không có quyền sudo trừ khi SSH_SUDO=yes). Để trống = SSH bằng user chính.
SSH_USER=
SSH_PASSWORD=
SSH_PASSWORD_HASH=
# Public key (1 dòng "ssh-ed25519 AAAA… máy-tôi") — an toàn hơn mật khẩu
SSH_AUTHORIZED_KEY=
# no = chỉ cho đăng nhập bằng key (cần SSH_AUTHORIZED_KEY)
SSH_PASSWORD_AUTH=yes
SSH_SUDO=no
# Chỗ lưu trữ riêng của user SSH (thư mục home):
#   để trống = /srv/<SSH_USER> · /data/remote = thư mục khác
#   /dev/sdb1, LABEL=SSHDATA = phân vùng riêng, gắn vào /srv/<SSH_USER> (tự gắn mỗi lần boot)
SSH_STORAGE=
# yes = quick format phân vùng SSH_STORAGE (ext4) — MẤT dữ liệu trên đó. no = dùng nguyên (phải có sẵn hệ thống tệp)
SSH_STORAGE_FORMAT=no

# yes = bật ufw: chặn mọi kết nối vào, chỉ mở SSH (nếu bật), LocalSend 53317, mDNS 5353 (máy in, chia sẻ)
FIREWALL=yes

# ---------- Lệnh sau khi cài (giống SetupComplete.cmd / FirstLogonCommands) ---
# POST_INSTALL: chạy NGAY khi cài xong, bên trong hệ thống mới, quyền root. Viết nhiều dòng POST_INSTALL được,
#   chạy theo thứ tự. Có sẵn biến $DEPOT_USER (tên đăng nhập) và $DEPOT_HOSTNAME.
#   Lỗi một lệnh không làm hỏng cả bản cài (ghi vào log /var/log/depot/autoinstall.log).
# POST_INSTALL="echo 'Chào mừng!' > /home/$DEPOT_USER/README.txt"
# POST_INSTALL="systemctl enable ssh"
#
# FIRSTBOOT: chạy 1 LẦN ở lần khởi động đầu tiên của máy đã cài (có mạng), quyền root.
#   Log: /var/log/depot/firstboot.log
# FIRSTBOOT="flatpak install -y flathub org.telegram.desktop"
#
# Chép file kèm theo: tạo thư mục depot-files/ cạnh file này, mọi thứ bên trong được chép đè vào gốc
#   máy mới (giống $OEM$\$1 của Windows). Ví dụ depot-files/etc/hosts → /etc/hosts.

# ---------- Khi cài xong -----------------------------------------------------
# reboot = khởi động lại (nhớ rút USB, hoặc để máy boot ổ cứng trước)
# poweroff = tắt máy (cài hàng loạt nhiều máy)    none = đứng yên ở màn hình
FINISH=reboot
