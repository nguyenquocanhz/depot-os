# Depot OS — tên tiếng Việt cho các mục trong Settings Manager mà gói gốc để tiếng Anh, dịch sai hoặc khó hiểu
# (ví dụ org.xfce.mousepad-settings: bản dịch gốc ghi "Gỡ cài đặt" cho "Text Editor Settings").
# Hook 0725-depot-settings-names chép file .desktop gốc sang /usr/local/share/applications (đứng trước
# /usr/share trong XDG_DATA_DIRS) rồi ghi Name[vi] / Comment[vi] — gói gốc cập nhật không làm mất tên.
# Mỗi dòng: id file .desktop | Tên | Chú thích. Tiếng Anh và ngôn ngữ khác giữ nguyên của gói.
nm-connection-editor|Kết nối mạng|Wi-Fi, mạng dây, VPN, IP tĩnh, mạng ẩn
blueman-manager|Bluetooth|Ghép đôi tai nghe, loa, chuột, điện thoại
blueman-adapters|Bộ thu phát Bluetooth|Đổi tên máy trên Bluetooth, cho máy khác nhìn thấy
xfce-ui-settings|Giao diện|Chủ đề sáng tối, bộ icon, phông chữ
xfce-display-settings|Màn hình|Độ phân giải, tần số quét, xoay, nhiều màn hình
xfce-keyboard-settings|Bàn phím|Phím tắt, bố cục phím, tốc độ lặp phím
xfce-mouse-settings|Chuột và touchpad|Tốc độ con trỏ, chạm để bấm, cuộn, con trỏ
org.pulseaudio.pavucontrol|Âm thanh|Chọn loa, micro, âm lượng riêng từng ứng dụng
thunar-volman-settings|USB và ổ đĩa rời|Cắm USB, thẻ nhớ, máy ảnh thì tự mở hay không
xfce4-color-settings|Hồ sơ màu|Màu chuẩn cho màn hình, máy in, máy quét
xfce4-power-manager-settings|Nguồn điện|Tắt màn hình, ngủ, nút nguồn, gập máy, độ sáng
xfce4-mime-settings|Ứng dụng mặc định|Trình duyệt, thư, và app mở từng loại tệp
thunar-settings|Tuỳ chọn trình quản lý tệp|Cách hiện tệp, thanh bên, hành vi của Thunar
xfce4-terminal-settings|Tuỳ chọn Terminal|Phông chữ, màu, phím tắt của Terminal
org.xfce.mousepad-settings|Tuỳ chọn trình soạn văn bản|Phông chữ, màu, thụt lề của Mousepad
xfce-wm-settings|Cửa sổ|Kiểu thanh tiêu đề, phím tắt cửa sổ, cách lấy tiêu điểm
xfce-wmtweaks-settings|Tinh chỉnh cửa sổ|Chuyển cửa sổ, dính mép, đặt cửa sổ, compositor
panel-preferences|Thanh panel|Vị trí, kích thước, các nút trên thanh
xfce-backdrop-settings|Icon và menu desktop|Icon trên màn hình nền, menu chuột phải, hình nền từng màn hình
xfce-workspaces-settings|Không gian làm việc|Số desktop ảo và tên từng cái
xfce-session-settings|Phiên và ứng dụng khởi động|App tự chạy khi đăng nhập, lưu phiên, hỏi khi đăng xuất
xfce4-accessibility-settings|Trợ năng|Phím dính, phím chậm, điều khiển chuột bằng bàn phím
xfce4-settings-editor|Trình sửa thiết lập (nâng cao)|Sửa trực tiếp mọi thiết lập của XFCE — cẩn thận
xfce4-clipman-settings|Bộ nhớ tạm (Clipboard)|Lịch sử sao chép: giữ bao nhiêu mục, chọn là dán, có lưu khi tắt máy không (Win+V)
xfce4-clipman|Bộ nhớ tạm|Lịch sử những gì đã sao chép — bấm Win+V để chọn lại
fcitx5-configtool|Bộ gõ nâng cao (Fcitx 5)|Bảng gõ tắt, biên tập bàn phím, thêm bộ gõ ngôn ngữ khác — việc thường ngày dùng Unikey
