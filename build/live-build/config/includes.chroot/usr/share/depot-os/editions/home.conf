ID=home
STATUS=ready
ORDER=1
NAME="Depot OS Home"
TAGLINE="Nhẹ và mượt cho máy phổ thông, máy cũ"
DESC="Đủ dùng hằng ngày: duyệt web, học, xem phim, nhắn tin, văn phòng. Hiệu ứng tự chọn theo máy, không chạy gì thừa."
# máy hợp: CPU chưa có AVX2 (trước ~2013, ví dụ Core i3/i5 đời 2–3), hoặc RAM dưới 8 GB, hoặc dưới 4 luồng
APPS=""
