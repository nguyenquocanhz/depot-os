# Depot OS — driver Intel chỉ áp cho máy Intel thật (HD 2000/3000... Sandy Bridge)
# OutputClass + MatchDriver: chỉ bật khi kernel dùng i915.
# Máy ảo (VMware vmwgfx, VirtualBox vboxvideo...) và GPU khác tự dùng modesetting.
Section "OutputClass"
    Identifier  "intel-ddx"
    MatchDriver "i915"
    Driver      "intel"
    Option      "AccelMethod" "sna"
    # picom đã vsync; bật thêm TearFree là hai lớp đệm khung hình, chuột và cửa sổ trễ thấy rõ
    Option      "TearFree"    "false"
EndSection
