# Depot OS — PackageKit (cài kèm GNOME Software) cũng nghe /system-update; khi cờ là của depot-update thì nó
# không có gì để cài, báo lỗi và FailureAction=reboot → khởi động lại giữa chừng. Chỉ chạy khi GNOME Software
# thật sự đã chuẩn bị bản cập nhật ("Khởi động lại & cập nhật" của GNOME Software).
[Unit]
ConditionPathExists=/var/lib/PackageKit/prepared-update
