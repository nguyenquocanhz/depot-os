# Depot OS — đồng bộ giờ (systemd-timesyncd), tự chạy khi có mạng.
# Máy chủ chính: time.windows.com (như Windows — máy dual-boot hai hệ điều hành cùng một nguồn giờ).
# Dự phòng: 0/1.debian.pool.ntp.org, vendor zone của Debian — máy chủ chính không trả lời thì timesyncd tự chuyển
# sang máy kế trong danh sách. (FallbackNTP= không dùng được cho việc này: nó chỉ có tác dụng khi NTP= để trống.)
#
# KHÔNG ghi vn.pool.ntp.org hay pool.ntp.org: luật NTP Pool (ntppool.org/vendors) cấm OS dùng tên pool chung
# làm mặc định; zone VN lại chỉ có 5 máy IPv4 (đo 30/10/2026: 2/3 máy không trả lời).
# Khi được cấp vendor zone riêng (đăng ký ở manage.ntppool.org) thì thay hai tên debian bằng 0/1.depot.pool.ntp.org.
#
# Người dùng đổi máy chủ trong "Ngôn ngữ và ngày giờ" (depot-region): ghi ra 60-depot-server.conf, đè file này.
# Máy chủ giờ tự host trong mạng nội bộ (chrony, router…): depot-region server 192.168.1.10
[Time]
NTP=time.windows.com 0.debian.pool.ntp.org 1.debian.pool.ntp.org
