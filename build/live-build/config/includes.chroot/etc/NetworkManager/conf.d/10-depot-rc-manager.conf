# Depot OS — NetworkManager tự ghi /etc/resolv.conf (đi theo symlink nếu có).
# Gói systemd-resolved (cho "DNS mã hoá") cài kèm /usr/sbin/resolvconf → NM để "auto" sẽ chuyển sang
# gọi resolvconf, mà resolved tắt sẵn nên lỗi "resolvconf failed" và resolv.conf trống (mất DNS).
# Bật DNS mã hoá thì depot-dns-helper đặt dns=none + resolv.conf → stub của resolved, NM không đụng tới.
[main]
rc-manager=file
