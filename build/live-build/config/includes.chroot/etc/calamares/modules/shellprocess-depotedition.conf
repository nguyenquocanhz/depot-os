# Depot OS — tự chọn phiên bản (Home / Pro / for Workstation) theo máy đang cài, ghi /etc/depot-edition vào hệ mới,
# bật tường lửa / tinh chỉnh, cài app thêm của bản (không có mạng: cài sau qua depot-update). Chạy SAU depotapps
# (nguồn apt đã trỏ ra mạng), xem hook 1235. Lệnh luôn trả 0; dấu "-" là chốt chặn thứ hai.
---
dontChroot: true
timeout: 3600
script:
    - "-/usr/bin/depot-edition --target ${ROOT} auto"
i18n:
    name: "Chọn phiên bản Depot cho máy này"
    name[vi]: "Chọn phiên bản Depot cho máy này"
