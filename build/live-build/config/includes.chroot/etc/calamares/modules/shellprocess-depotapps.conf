# Depot OS — tải và cài app lúc cài đặt (ISO chỉ mang phần chạy thử máy), rồi tải sẵn bản cập nhật. Chạy SAU
# sources-final (nguồn apt đã trỏ ra mạng), xem hook 1230.
# Khởi động lại lần đầu sẽ vào màn chờ cập nhật. Không có mạng thì bỏ qua, máy đã cài tự làm khi có mạng.
# Dấu "-" trước lệnh: lỗi không làm Calamares báo cài thất bại (lệnh vốn luôn trả 0, đây là chốt chặn thứ hai).
---
dontChroot: true
timeout: 5400
script:
    - "-/usr/bin/depot-install-apps --target ${ROOT}"
i18n:
    name: "Tải ứng dụng và bản cập nhật"
    name[vi]: "Tải ứng dụng và bản cập nhật"
